<main class="login-page">
  <section class="login-panel" aria-label="Inicio de sesion">
    <div class="brand-block">
      <span class="mark">AF</span>
      <p>Panel financiero</p>
      <h1>Asistente Financiero</h1>
    </div>

    <form *ngIf="modo() === 'login'" [formGroup]="form" (ngSubmit)="ingresar()" class="login-form">
      <label>
        Correo
        <input type="email" formControlName="correo" autocomplete="email" placeholder="admin@correo.com" />
      </label>

      <label>
        Contrasena
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="Minimo 6 caracteres" />
      </label>

      <p *ngIf="mensaje()" class="alert success">{{ mensaje() }}</p>
      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Validando...' : 'Entrar' }}
      </button>

      <button class="link-btn" type="button" (click)="mostrarRegistro()">Crear cuenta</button>
      <button class="link-btn" type="button" (click)="mostrarRecuperacion()">Recuperar contrasena</button>
    </form>

    <form *ngIf="modo() === 'registro'" [formGroup]="registroForm" (ngSubmit)="registrar()" class="login-form">
      <label>
        Nombre
        <input type="text" formControlName="nombre" autocomplete="name" placeholder="Tu nombre" />
      </label>

      <label>
        Correo
        <input type="email" formControlName="correo" autocomplete="email" placeholder="correo@dominio.com" />
      </label>

      <label>
        Contrasena
        <input type="password" formControlName="password" autocomplete="new-password" placeholder="Minimo 6 caracteres" />
      </label>

      <label>
        Confirmar contrasena
        <input type="password" formControlName="confirmarPassword" autocomplete="new-password" placeholder="Repite la contrasena" />
      </label>

      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Registrando...' : 'Crear cuenta' }}
      </button>
      <button class="link-btn" type="button" (click)="mostrarLogin()">Ya tengo cuenta</button>
    </form>

    <form *ngIf="modo() === 'recuperar'" [formGroup]="recuperacionForm" (ngSubmit)="solicitarCodigo()" class="login-form">
      <label>
        Correo
        <input type="email" formControlName="correo" autocomplete="email" placeholder="correo@dominio.com" />
      </label>

      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Enviando...' : 'Enviar codigo' }}
      </button>
      <button class="link-btn" type="button" (click)="mostrarLogin()">Volver al login</button>
    </form>

    <form *ngIf="modo() === 'codigo'" [formGroup]="codigoForm" (ngSubmit)="verificarCodigo()" class="login-form">
      <p class="helper">Codigo enviado a {{ correoRecuperacion() }}</p>

      <label>
        Codigo
        <input type="text" formControlName="codigoIngresado" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digitos" />
      </label>

      <p *ngIf="mensaje()" class="alert success">{{ mensaje() }}</p>
      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Verificando...' : 'Verificar codigo' }}
      </button>
      <button class="link-btn" type="button" (click)="mostrarRecuperacion()">Cambiar correo</button>
    </form>

    <form *ngIf="modo() === 'nueva'" [formGroup]="nuevaPasswordForm" (ngSubmit)="cambiarPassword()" class="login-form">
      <label>
        Nueva contrasena
        <input type="password" formControlName="nuevaContrasena" autocomplete="new-password" placeholder="Minimo 6 caracteres" />
      </label>

      <label>
        Confirmar contrasena
        <input type="password" formControlName="confirmarContrasena" autocomplete="new-password" placeholder="Repite la contrasena" />
      </label>

      <p *ngIf="mensaje()" class="alert success">{{ mensaje() }}</p>
      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Guardando...' : 'Guardar contrasena' }}
      </button>
    </form>
  </section>
</main>
