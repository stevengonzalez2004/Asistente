<main class="login-page">
  <section class="login-panel" aria-label="Inicio de sesion">
    <div class="brand-block">
      <span class="mark">AF</span>
      <p>Panel financiero</p>
      <h1>Asistente Financiero</h1>
    </div>

    <form *ngIf="modo() === 'login'" [formGroup]="form" (ngSubmit)="ingresar()" class="login-form">
      <label>
        Correo
        <input type="email" formControlName="correo" autocomplete="email" placeholder="admin@correo.com" />
        <span *ngIf="form.controls.correo.touched && form.controls.correo.hasError('required')" class="field-error">El correo es obligatorio.</span>
        <span *ngIf="form.controls.correo.touched && form.controls.correo.hasError('email')" class="field-error">Ingresa un correo valido.</span>
      </label>

      <label>
        Contrasena
        <div class="password-wrap">
          <input [type]="verPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Minimo 6 caracteres" />
          <button type="button" class="eye-btn" (click)="toggleVerPassword()" [title]="verPassword() ? 'Ocultar contraseña' : 'Ver contraseña'">
            <svg *ngIf="!verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
        <span *ngIf="form.controls.password.touched && form.controls.password.hasError('required')" class="field-error">La contrasena es obligatoria.</span>
        <span *ngIf="form.controls.password.touched && form.controls.password.hasError('minlength')" class="field-error">La contrasena debe tener al menos 6 caracteres.</span>
      </label>

      <p *ngIf="mensaje()" class="alert success">{{ mensaje() }}</p>
      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Validando...' : 'Entrar' }}
      </button>

      <div class="google-divider">
        <span>o continúa con</span>
      </div>

      <div class="google-btn-wrapper">
        <button type="button" class="btn-google-custom" (click)="iniciarGoogleOAuthDirecto()" [disabled]="cargando()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
          <span>Continuar con Google</span>
        </button>
      </div>

      <button class="link-btn" type="button" (click)="mostrarRegistro()">Crear cuenta</button>
      <button class="link-btn" type="button" (click)="mostrarRecuperacion()">Recuperar contrasena</button>
    </form>

    <form *ngIf="modo() === 'registro'" [formGroup]="registroForm" (ngSubmit)="registrar()" class="login-form">
      <label>
        Nombre
        <input type="text" formControlName="nombre" autocomplete="name" placeholder="Tu nombre" />
        <span *ngIf="registroForm.controls.nombre.touched && registroForm.controls.nombre.hasError('required')" class="field-error">El nombre es obligatorio.</span>
        <span *ngIf="registroForm.controls.nombre.touched && registroForm.controls.nombre.hasError('minlength')" class="field-error">El nombre debe tener al menos 2 caracteres.</span>
      </label>

      <label>
        Correo
        <input type="email" formControlName="correo" autocomplete="email" placeholder="correo@dominio.com" />
        <span *ngIf="registroForm.controls.correo.touched && registroForm.controls.correo.hasError('required')" class="field-error">El correo es obligatorio.</span>
        <span *ngIf="registroForm.controls.correo.touched && registroForm.controls.correo.hasError('email')" class="field-error">Ingresa un correo valido.</span>
      </label>

      <label>
        Contrasena
        <div class="password-wrap">
          <input [type]="verPassword() ? 'text' : 'password'" formControlName="password" autocomplete="new-password" placeholder="Minimo 6 caracteres" />
          <button type="button" class="eye-btn" (click)="toggleVerPassword()" [title]="verPassword() ? 'Ocultar contraseña' : 'Ver contraseña'">
            <svg *ngIf="!verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
        <span *ngIf="registroForm.controls.password.touched && registroForm.controls.password.hasError('required')" class="field-error">La contrasena es obligatoria.</span>
        <span *ngIf="registroForm.controls.password.touched && registroForm.controls.password.hasError('minlength')" class="field-error">Minimo 6 caracteres.</span>
      </label>

      <label>
        Confirmar contrasena
        <div class="password-wrap">
          <input [type]="verPassword() ? 'text' : 'password'" formControlName="confirmarPassword" autocomplete="new-password" placeholder="Minimo 6 caracteres" />
          <button type="button" class="eye-btn" (click)="toggleVerPassword()" [title]="verPassword() ? 'Ocultar contraseña' : 'Ver contraseña'">
            <svg *ngIf="!verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
        <span *ngIf="registroForm.controls.confirmarPassword.touched && registroForm.controls.confirmarPassword.hasError('required')" class="field-error">Confirma tu contrasena.</span>
        <span *ngIf="registroForm.controls.confirmarPassword.touched && registroForm.controls.password.value !== registroForm.controls.confirmarPassword.value" class="field-error">Las contrasenas no coinciden.</span>
      </label>

      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Registrando...' : 'Crear cuenta' }}
      </button>
      <button class="link-btn" type="button" (click)="mostrarLogin()">Ya tengo cuenta</button>
    </form>

    <form *ngIf="modo() === 'recuperar'" [formGroup]="recuperacionForm" (ngSubmit)="solicitarCodigo()" class="login-form">
      <label>
        Correo
        <input type="email" formControlName="correo" autocomplete="email" placeholder="correo@dominio.com" />
        <span *ngIf="recuperacionForm.controls.correo.touched && recuperacionForm.controls.correo.hasError('required')" class="field-error">El correo es obligatorio.</span>
        <span *ngIf="recuperacionForm.controls.correo.touched && recuperacionForm.controls.correo.hasError('email')" class="field-error">Ingresa un correo valido.</span>
      </label>

      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Enviando...' : 'Enviar codigo' }}
      </button>
      <button class="link-btn" type="button" (click)="mostrarLogin()">Volver al login</button>
    </form>

    <form *ngIf="modo() === 'codigo'" [formGroup]="codigoForm" (ngSubmit)="verificarCodigo()" class="login-form">
      <p class="helper">Codigo enviado a {{ correoRecuperacion() }}</p>

      <label>
        Codigo
        <input type="text" formControlName="codigoIngresado" inputmode="numeric" autocomplete="one-time-code" placeholder="6 digitos" />
        <span *ngIf="codigoForm.controls.codigoIngresado.touched && codigoForm.controls.codigoIngresado.hasError('required')" class="field-error">El codigo es obligatorio.</span>
        <span *ngIf="codigoForm.controls.codigoIngresado.touched && (codigoForm.controls.codigoIngresado.hasError('minlength') || codigoForm.controls.codigoIngresado.hasError('maxlength'))" class="field-error">El codigo debe ser de 6 digitos.</span>
      </label>

      <p *ngIf="mensaje()" class="alert success">{{ mensaje() }}</p>
      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Verificando...' : 'Verificar codigo' }}
      </button>
      <button class="link-btn" type="button" (click)="mostrarRecuperacion()">Cambiar correo</button>
    </form>

    <form *ngIf="modo() === 'nueva'" [formGroup]="nuevaPasswordForm" (ngSubmit)="cambiarPassword()" class="login-form">
      <label>
        Nueva contrasena
        <div class="password-wrap">
          <input [type]="verPassword() ? 'text' : 'password'" formControlName="nuevaContrasena" autocomplete="new-password" placeholder="Minimo 6 caracteres" />
          <button type="button" class="eye-btn" (click)="toggleVerPassword()" [title]="verPassword() ? 'Ocultar contraseña' : 'Ver contraseña'">
            <svg *ngIf="!verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
        <span *ngIf="nuevaPasswordForm.controls.nuevaContrasena.touched && nuevaPasswordForm.controls.nuevaContrasena.hasError('required')" class="field-error">La nueva contrasena es obligatoria.</span>
        <span *ngIf="nuevaPasswordForm.controls.nuevaContrasena.touched && nuevaPasswordForm.controls.nuevaContrasena.hasError('minlength')" class="field-error">Minimo 6 caracteres.</span>
      </label>

      <label>
        Confirmar contrasena
        <div class="password-wrap">
          <input [type]="verPassword() ? 'text' : 'password'" formControlName="confirmarContrasena" autocomplete="new-password" placeholder="Minimo 6 caracteres" />
          <button type="button" class="eye-btn" (click)="toggleVerPassword()" [title]="verPassword() ? 'Ocultar contraseña' : 'Ver contraseña'">
            <svg *ngIf="!verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="verPassword()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
        <span *ngIf="nuevaPasswordForm.controls.confirmarContrasena.touched && nuevaPasswordForm.controls.confirmarContrasena.hasError('required')" class="field-error">Confirma la contrasena.</span>
        <span *ngIf="nuevaPasswordForm.controls.confirmarContrasena.touched && nuevaPasswordForm.controls.nuevaContrasena.value !== nuevaPasswordForm.controls.confirmarContrasena.value" class="field-error">Las contrasenas no coinciden.</span>
      </label>

      <p *ngIf="mensaje()" class="alert success">{{ mensaje() }}</p>
      <p *ngIf="error()" class="alert">{{ error() }}</p>

      <button type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Guardando...' : 'Guardar contrasena' }}
      </button>
    </form>
  </section>
</main>
